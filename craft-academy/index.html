<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Craft Academy — Learn it. Try it. Master it. A challenge-first learning companion for the ArtCraft creative software suite."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Craft Academy — Learn it. Try it. Master it.</title>
    <!--
      Relative paths on purpose: the build is published under a sub-path and is intended to work
      from a file:// path inside a desktop wrapper, and the router is a hash router, so the document
      URL never leaves the application root.
    -->
    <link rel="icon" type="image/png" href="./brand/iyzkold-studios-favicon.png" />
    <link rel="apple-touch-icon" href="./brand/iyzkold-studios-apple-touch.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var raw = window.localStorage.getItem('craft-academy:theme');
        var theme = raw === '"light"' || raw === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* localStorage can be unavailable; dark is the default. */
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D2Kr_KPt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CccpWW1y.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Craft Academy needs JavaScript enabled to run its lessons.</noscript>
  </body>
</html>
